# AddBiomechanics as a profile: an OpenSim skeleton with joint angles per frame, stored in .b3d
# containers, one subject per file, trials inside.
#
# This profile reproduces the reference AddBiomechanics conversion of 2026-09-15: a bone-length
# shape fit with no landmark offsets, an unrecorded sex read as the neutral body, and the 53
# trials that carry no dynamics pass left out. Every value below says what it means for this
# dataset.
schema: smpl18_profile_v1
id: addbiomechanics
description: AddBiomechanics .b3d subjects (OpenSim Rajagopal-family skeletons, marker-driven IK)
source_kind: skeleton_motion
format: b3d

layout:
  # Payload sits under <split>/<variant>/<study>/ directories; every *.b3d below a study is one
  # subject, named by the file's parent directory
  # (e.g. train/With_Arm/Carter2023_Formatted_With_Arm/subject01/subject01.b3d).
  subject: "{split}/{variant}/{study}/**/{subject}/*.b3d"
  trial: within_container           # the trials live inside the container, not as sibling files
  skip_empty_files: true            # a zero-byte .b3d holds no payload and is not a subject

bindings:
  gender:
    field: biological_sex           # the container's own subject-header field
    # The field is read as stored, by its first initial: m -> male, f -> female. The cohort
    # writes female, male, f and unknown.
    map: {female: female, f: female, male: male, m: male, unknown: neutral}
    # unknown selects the neutral body because the container itself says unknown: a subject whose
    # sex was never recorded gets no invented one. Any other value lands here too.
    default: neutral
  stature_m: {field: height_m}      # subject header height in metres, absent for some subjects
  # Mass is compared through the body model's mesh volume, so it is read only when that model
  # carries faces.
  mass_kg: {field: mass_kg}         # subject header mass in kg
  frames:
    pass: dynamics                  # the container's own dynamics pass index
    unfiltered_pass: kinematics     # the wrap repair reads its branch cuts from the unfiltered pass
  root_translation: [pelvis_tx, pelvis_ty, pelvis_tz]   # the pelvis coordinates that translate, not rotate

conventions:
  up_axis: y                        # the models declare gravity (0, -9.80665, 0)
  length_unit: m
  angle_unit: rad                   # the coordinates in a pass are radians
  # The frame is taken from the gravity each file's model declares, not assumed.
  up_axis_check: model_gravity

correspondence: ../correspondence/opensim_rajagopal.yaml   # picked by the topology the container declares

shape:
  method: bone_lengths              # betas fitted to the segment lengths measured on the skeleton
  # The reference conversion applied no landmark offsets and this profile keeps that.
  # ../offsets/addbiomechanics_landmarks_v1.yaml holds the table a profile can opt into.
  landmark_offsets: none
  rescale_to_measured: false
  # Shape is fitted once per subject on frames concatenated from the first
  # settings.shape_fit.sample_trials eligible trials; not a per-trial median.
  pool_per_subject: false
  from_trials: all
  use_stature: true                 # the header's height constrains the fit
  use_mass: true                    # so does its mass, through the body model's volume

root:
  placement: pelvis_centre          # trans is the root centre plus the fitted offset
  alignment: child_offsets          # the root rotation is fitted from every child offset
  tracked: []                       # no per-frame root solve
  recover_frozen: false

pose:
  method: segment_rotation_transfer # G_smpl[j] = R_world . G_source[body(j)] . A[j]
  reference: none                   # no reference rotations are supplied
  place_unfitted_from_reference: false
  lumbar_zero_from_reference: false # OpenSim frames coincide at zero coordinates

provenance:
  # Marker-driven IK over the whole body: a joint the model declares is a joint the solve had
  # evidence for. Absent joints come from the correspondence intersection.
  restrict_to_driven: none

repairs:
  wrap:
    # Not keyed on a coordinate name: every column whose unfiltered pass carries a 2*pi
    # staircase is rebuilt, the rest are left bit-identical. Over the cohort the repair rebuilt
    # pelvis_rotation 2,012 times, arm_rot_r 93 and arm_flex_r 37.
    coordinates: any
    # Filter constants are read from each trial's own lowPassFilter pass header rather than
    # chosen here.
    filter: declared_by_source
    declared_pass: lowPassFilter
    # A repaired trial's stored centres still hold the corrupted heading, so they are recomputed
    # by forward kinematics from the repaired coordinates; an untouched trial keeps the source's
    # own centres.
    recompute_centres: true
  resample: none                    # the source rate is kept; a frame cap only thins
  discontinuity: {settings_key: discontinuity, action: flag}   # scanned and flagged on the index entry, never dropped

skip:
  trials_without_pass: dynamics     # 53 trials in the cohort carry no dynamics pass
  empty_trials: true                # a trial of zero length
  subjects_with_unresolved_gender: false   # the default above resolves every value, so nothing is skipped here

settings:
  - ../settings/default.yaml
  - ../settings/addbiomechanics.yaml
