# Numbers the AddBiomechanics conversion sets for itself, layered over default.yaml by the
# profile's settings list. They are the ones the reference conversion of 2026-09-15 ran with.
schema: smpl24_settings_v1
id: addbiomechanics

shape_fit:
  # Shape is fitted once per subject from the first eligible trials, sampling frames evenly
  # across each of them.
  sample_trials: 3
  sample_frames_per_trial: 60
