# AMASS as a profile: SMPL-H parameters in npz files, one sequence per file, sub-datasets as
# top-level directories.
#
# Its choices: the 22 body joints taken
# from the stored SMPL-H poses, betas truncated to ten, and every sequence resampled to 100 Hz.
# Every value below says what it means for this dataset.
schema: smpl18_profile_v1
id: amass
description: AMASS SMPL-H sequences (*_poses.npz) under sub-dataset directories
source_kind: smpl_parameters
format: npz

layout:
  # Every *.npz below a sub-dataset directory; the subject is the file's parent directory and the
  # sub-dataset the first directory ({study} here).
  subject: "{study}/{subject}"
  # Motion sequences are named <seq>_poses.npz; shape.npz carries gender and betas only and is
  # excluded rather than silently dropped.
  trial: "{study}/{subject}/{trial}_poses.npz"
  exclude: ["shape.npz"]

bindings:
  # poses [N, 156] SMPL-H axis-angle -> [N, 52, 3]; the first 22 body joints are kept and the two
  # hands set to identity.
  poses: {field: poses, layout: "T,J*3"}
  # 16 shape parameters as stored; the body model carries 10, so the rest are truncated.
  betas: {field: betas}
  trans: {field: trans}             # the root translation as stored, in metres
  fps:
    field: mocap_framerate          # the rate the npz declares
    aliases: [mocap_frame_rate]     # some sub-datasets spell the key with an underscore
    # When the npz omits the rate, the sub-dataset's standard mocap rate stands in.
    fallback_key: study
    fallback: {BMLmovi: 120.0, CMU: 120.0, Transitions: 120.0, KIT: 100.0, TotalCapture: 60.0}
  gender:
    field: gender                   # stored as a string, as bytes or as a 0-d array
    map: {male: male, m: male, female: female, f: female, neutral: neutral, n: neutral}
    # A missing field means neutral; an unrecognised value is an error, so no default is given
    # here.
    when_absent: neutral

conventions:
  up_axis: z                        # Z-up in every sub-dataset, as measured across the archive
  length_unit: m
  angle_unit: rad

shape:
  method: parameters                # betas come from the source; no fit

root:
  placement: source_translation     # trans is the SMPL translation as stored

repairs:
  wrap: none
  # Every sequence is brought to 100 Hz: per-joint Slerp on local rotations, linear interpolation
  # on trans; a no-op at 100 Hz.
  resample: {fps: 100, rotations: slerp, translation: linear}
  discontinuity: {settings_key: discontinuity, action: flag}

skip:
  # Non-finite poses, trans or betas fail the sequence rather than being repaired (the Transitions
  # archive has known non-finite frames).
  trials_with_nonfinite_input: true

settings: ../settings/default.yaml
