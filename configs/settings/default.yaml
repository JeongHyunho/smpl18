# Engine settings shared by every profile. Numbers only live here, never in library code: a
# function that needs one of these takes a settings mapping and fails when the key is missing.
# These are the values the reference conversions of 2026-09-15 ran with.
schema: smpl18_settings_v1
id: default

shape_fit:
  n_betas: 10                     # shape parameters solved for
  regularisation: 1.0e-3          # weight of the beta penalty that holds the fit near the mean body
  stature_weight: 0.3             # weight of the stature residual against the bone-length residuals
  mass_weight: 0.05               # weight of the mass residual
  body_density_kg_m3: 1000.0      # mass from mesh volume assumes water density (a stated assumption)
  optimiser: trf                  # trust-region reflective least squares
  include_torso_paths: true       # the pelvis-to-shoulder paths join the lengths being matched
  # Bone lengths are the median over the frames measured.
  length_statistic: median

pose_transfer:
  # The three spine joints share the trunk's rotation in equal thirds.
  lumbar_split: equal_thirds
  # A root fitted from child offsets needs at least this many to fit a translation as well as
  # a rotation.
  root_min_children_for_offset: 3
  # Directions handed to a root placement are normalised before the fit.
  direction_norm_floor: 1.0e-12

wrap:
  # Read from each trial's own lowPassFilter pass header when the profile says
  # filter: declared_by_source. These are the values all 40,537 filtered passes of the
  # AddBiomechanics cohort declare, with no exception; used when filter: from_settings.
  filter_order: 2
  filter_cutoff_hz: 30.0
  # filtfilt pads with 3 * max(len(a), len(b)) samples; below that a wrapping column cannot be
  # repaired and the trial must not be passed off as clean.
  min_frames: 10

resample:
  rotations: slerp                # per-joint Slerp on the local rotations
  translation: linear             # per-axis linear interpolation on trans
  # Guards the floor in the resampled frame count against float underflow.
  endpoint_epsilon: 1.0e-9
  # A sequence shorter than this after resampling is refused.
  min_frames_after: 4

discontinuity:
  # The blow-up band, in deg/s, shared with the gyro check; divided by the frame rate it is the
  # largest step any joint's global rotation may take between adjacent frames.
  gyro_abs_max_deg_s: 8000.0
  # Pelvis-to-spine3 median angle above which a take's trunk is inverted, not bent.
  trunk_inversion_limit_deg: 150.0
  # Which SMPL joints the trunk angle is measured between.
  trunk_joints: [pelvis, spine3]

reduce:
  # The corpus stores 18 joints: spine1, spine2 and both collars are frozen to per-subject
  # constants and the hands are dropped. The constants are fitted, not assumed, because a wrong
  # constant displaces every joint below the freeze while leaving orientations exact.
  # Most frames the fit measures; a longer trial is sampled evenly down to this, so a long take
  # costs no more to fit than a short one.
  sample_frames: 1500
  # scipy.optimize.least_squares method for the twelve parameters (four rotation vectors).
  optimiser: lm
  # Cap on residual evaluations, so a pathological subject cannot stall a corpus.
  max_evaluations: 200

frames:
  # Whole trials are converted unless a profile's settings say otherwise.
  max_per_trial: all
