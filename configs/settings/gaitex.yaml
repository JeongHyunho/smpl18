# Numbers the GAITEX conversion sets for itself, layered over default.yaml by the profile's
# settings list, plus the joint ranges declared for this dataset.
schema: smpl18_settings_v1
id: gaitex

shape_fit:
  # Frames sampled evenly across a trial for the pooled shape fit.
  sample_frames_per_trial: 400
  # A trial with fewer solved-pelvis shape frames than this contributes nothing to the shape.
  min_solved_frames_per_trial: 10

frames:
  # The longest solved span must be at least this long or the trial is unavailable.
  min_solved_span: 100

joint_ranges:
  # The ranges declared for this dataset, in degrees, on OpenSim coordinate names. Frames
  # outside a range are counted and recorded; none is dropped.
  limits_deg:                     # bounds on a single frame's coordinate value
    knee_angle_r: {min: -15.0, max: 155.0}
    knee_angle_l: {min: -15.0, max: 155.0}
    ankle_angle_r: {min: -60.0, max: 60.0}
    ankle_angle_l: {min: -60.0, max: 60.0}
    hip_flexion_r: {min: -40.0, max: 140.0}
    hip_flexion_l: {min: -40.0, max: 140.0}
    lumbar_extension: {min: -60.0, max: 60.0}
  span_limits_deg:                # the widest sweep a take may show; past these it is a solve
    knee_angle_r: 170.0           # that came apart, not a posture
    knee_angle_l: 170.0
    ankle_angle_r: 120.0
    ankle_angle_l: 120.0
    hip_flexion_r: 180.0
    hip_flexion_l: 180.0
    lumbar_extension: 120.0
