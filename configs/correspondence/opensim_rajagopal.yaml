# OpenSim joint names -> SMPL-24 joints, as data: the Rajagopal family, and gait2392/gait2354
# through the aliases at the end (those models name their knees knee_l/knee_r and have no arms).
#
# The table is intersected with the skeleton a file actually declares: a joint the model lacks
# makes its SMPL joint `absent` by the same rule that leaves the neck absent in every variant.
# Nothing here is a special case.
schema: smpl18_correspondence_v1
id: opensim_rajagopal
# Entries name source *joints*; the body driving an SMPL joint's rotation is the child body of
# the LAST joint in its chain (the distal segment SMPL spans: the calcaneus past the subtalar,
# not the talus). The FIRST joint supplies the position target (its centre); later joints
# contribute rotation only.
names: opensim_joints

joints:
  # The pelvis body's origin is not where SMPL puts its pelvis joint (between and above the
  # hips), so only its rotation is used; the hips and the lumbar centre place the root.
  pelvis:         {source: [ground_pelvis], position: false}
  left_hip:       {source: [hip_l]}
  right_hip:      {source: [hip_r]}
  spine1:         {fill: distribute}          # from the lumbar block below
  left_knee:      {source: [walker_knee_l]}
  right_knee:     {source: [walker_knee_r]}
  spine2:         {fill: distribute}
  left_ankle:     {source: [ankle_l, subtalar_l]}
  right_ankle:    {source: [ankle_r, subtalar_r]}
  spine3:         {fill: distribute}
  left_foot:      {source: [mtp_l]}
  right_foot:     {source: [mtp_r]}
  neck:           {fill: weld}                # no neck joint in any variant: follows its parent
  left_collar:    {fill: weld}
  right_collar:   {fill: weld}
  head:           {fill: weld}
  left_shoulder:  {source: [acromial_l]}      # absent in No_Arm models, by intersection
  right_shoulder: {source: [acromial_r]}
  left_elbow:     {source: [elbow_l, radioulnar_l]}
  right_elbow:    {source: [elbow_r, radioulnar_r]}
  left_wrist:     {source: [radius_hand_l]}
  right_wrist:    {source: [radius_hand_r]}
  left_hand:      {fill: weld}
  right_hand:     {fill: weld}

# The trunk is one rigid body measured through a single 3-DOF joint; its rotation is distributed
# over the three spine joints in equal thirds. Only the lowest of them has a measured centre to
# aim at: the `back` joint origin.
lumbar:
  source_joint: back
  smpl: [spine1, spine2, spine3]
  split: equal_thirds
  centre_on: spine1

# The body whose rotation, relative to the root body, the lumbar rule reads.
trunk_body: torso

# Coordinates that describe where the pelvis is, not how it is turned; they belong to `trans`
# and are never reported among a joint's rotation coordinates.
root_translation: [pelvis_tx, pelvis_ty, pelvis_tz]

# Source-name aliases, {name in the model file: name used in this table}.
aliases:
  knee_l: walker_knee_l
  knee_r: walker_knee_r
