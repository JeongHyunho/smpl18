[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smpl18"
version = "0.0.0"
description = "Convert motion capture (SMPL-family parameters, OpenSim skeletons, joint centres, markers, BVH/FBX) into an SMPL-24 pose corpus"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hyunho Jeong" }]
requires-python = ">=3.12"
# Runtime dependencies of the engine that moves in from the parent project. The parent's own
# pyproject pins lxml/pypdf/python-docx for unrelated work; none of that comes along.
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "protobuf>=6.30,<8",   # .b3d containers (vendored SubjectOnDisk proto)
  "pyyaml>=6,<7",        # profiles, correspondence tables, marker sets, settings
  "ezc3d>=1.5",          # .c3d marker files (owner decision 2026-09-15: a regular dependency)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
smpl18 = "smpl18.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"smpl18.formats._vendor.nimblephysics" = ["SubjectOnDisk.proto", "UPSTREAM.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]
addopts = "--strict-markers -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
